<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contactos de Emergencia - SEDAM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --color-bg: #ffffff;
            --color-text-base: #6b7280;
            --color-text-dark: #111827;
            --color-primary: #2563eb; /* Color principal de SEDAM */
            --color-primary-hover: #1e40af; /* Hover para color principal */
            --border-radius: 0.75rem;
            --font-family: 'Poppins', Arial, sans-serif;
            --shadow-base: 0 4px 8px rgb(0 0 0 / 0.05);
            --shadow-hover: 0 8px 20px rgb(37 99 235 / 0.3);
            --max-width: 900px; /* Ancho máximo para el contenido principal */

            /* Variables de color para los botones de emergencia específicos */
            --color-carabineros: #2a6f35; /* Verde oscuro */
            --color-bomberos: #c8102e; /* Rojo intenso */
            --color-ambulancia-bg: #f9fafb; /* Fondo blanco-grisáceo para ambulancia */
            --color-ambulancia-border: #111; /* Borde oscuro para ambulancia */

            /* Nuevas variables para tamaños de texto y accesibilidad (consistente con index y tramites) */
            --text-scale-factor: 1; /* Factor de escala inicial */
            --base-font-size: 20px; /* Tamaño base para el body */

            /* Variables para botón de emergencia global (consistente con index y tramites) */
            --emergency-btn-size: 100px;
            --emergency-btn-z-index: 11000;
            --tooltip-font-size: 1.1rem;
            --tooltip-color: #dc2626;
            --tooltip-font-weight: 700;
            --tooltip-text-transform: uppercase;
            --tooltip-padding: 10px 18px;
            --tooltip-border-radius: 8px;
            --tooltip-gap: 15px;
            --color-emergency-red: #dc2626;

            /* Variables para el fondo con círculos (consistente con index y tramites) */
            --circle-color-1: rgba(178, 223, 219, 0.4);
            --circle-color-2: rgba(255, 204, 188, 0.4);
            --circle-color-3: rgba(197, 225, 243, 0.4);
            --circle-color-4: rgba(255, 243, 198, 0.4);
            --circle-color-5: rgba(225, 190, 231, 0.4);
        }
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background-color: var(--color-bg);
            color: var(--color-text-base);
            font-family: var(--font-family);
            line-height: 1.6;
            /* Usamos calc() para que el tamaño de fuente sea adaptable */
            font-size: calc(var(--base-font-size) * var(--text-scale-factor));
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center; /* Centra el contenido horizontalmente */
            padding: 2rem 1rem 4rem; /* Ajustar padding para consistencia */
            position: relative; /* Necesario para los botones fijos */
            overflow-x: hidden; /* Evitar scroll horizontal por el fondo */

            /* Fondo con círculos de colores llamativos y simples, igual que en index.html */
            background-image: url("data:image/svg+xml,%3Csvg width='100%25' height='100%25' viewBox='0 0 1000 1000' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3CradialGradient id='g1' cx='50%25' cy='50%25' r='50%25'%3E%3Cstop offset='0%25' stop-color='%23FFF' stop-opacity='0'/%3E%3Cstop offset='100%25' stop-color='%23FFF' stop-opacity='0.1'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='100' cy='150' r='120' fill='%23B2DFDB' opacity='0.3'/%3E%3Ccircle cx='800' cy='50' r='150' fill='%23FFCCBC' opacity='0.3'/%3E%3Ccircle cx='300' cy='450' r='180' fill='%23C5E1F3' opacity='0.3'/%3E%3Ccircle cx='900' cy='700' r='100' fill='%23FFF3C6' opacity='0.3'/%3E%3Ccircle cx='50' cy='850' r='160' fill='%23E1BEE7' opacity='0.3'/%3E%3Ccircle cx='600' cy='250' r='90' fill='%23B2DFDB' opacity='0.2'/%3E%3Ccircle cx='150' cy='600' r='110' fill='%23FFCCBC' opacity='0.2'/%3E%3Ccircle cx='450' cy='900' r='140' fill='%23C5E1F3' opacity='0.2'/%3E%3Ccircle cx='750' cy='400' r='130' fill='%23FFF3C6' opacity='0.2'/%3E%3Ccircle cx='200' cy='30' r='80' fill='%23E1BEE7' opacity='0.2'/%3E%3C/svg%3E");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        header {
            position: sticky;
            top: 0;
            width: 100%;
            background: var(--color-bg);
            border-bottom: 1px solid #e5e7eb;
            z-index: 1000;
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px; /* Ancho máximo consistente con index.html */
            padding: 1rem;
            margin-bottom: 3rem; /* Espacio debajo del header */
            user-select: none;
            height: 6rem; /* Altura del header consistente con index.html */
        }
        .logo {
            /* CAMBIOS: Logo SEDAM aún más grande y negrita, consistente con index.html */
            font-weight: 800;
            font-size: 4rem;
            color: var(--color-primary);
            user-select: none;
            letter-spacing: 0.1em;
        }
        nav {
            display: flex;
            gap: 2.5rem; /* Más espacio entre los enlaces, consistente con index.html */
            font-weight: 600;
            font-size: 1.5rem; /* Enlaces de navegación más grandes, consistente con index.html */
            align-items: center;
        }
        nav a {
            color: var(--color-text-base);
            text-decoration: none;
            padding: 1rem 1.75rem; /* Más padding para los enlaces de navegación, consistente con index.html */
            border-radius: var(--border-radius);
            transition: background-color 0.3s ease, color 0.3s ease;
            user-select: none;
        }
        nav a:hover,
        nav a:focus-visible {
            background-color: var(--color-primary); /* Fondo azul al hover/focus */
            color: white; /* Texto blanco al hover/focus */
            outline: none;
        }
        main {
            flex-grow: 1;
            max-width: var(--max-width); /* Usar el ancho máximo consistente */
            width: 100%;
            text-align: center;
        }
        h1 {
            font-weight: 800;
            font-size: calc(3.5rem * var(--text-scale-factor)); /* Ajustar con text-scale-factor */
            margin-bottom: 2.5rem; /* Ajuste para un mejor espaciado */
            color: var(--color-text-dark);
            user-select: text;
        }
        .btn-emergency {
            display: block;
            max-width: 400px;
            width: 100%;
            margin: 1.5rem auto 1rem auto; /* Ajuste de margen inferior */
            padding: 1.5rem 0;
            border-radius: var(--border-radius);
            font-weight: 800;
            font-size: calc(3.5rem * var(--text-scale-factor)); /* Ajustar con text-scale-factor */
            cursor: pointer;
            box-shadow: var(--shadow-base);
            border: none;
            color: white;
            user-select: none;
            text-align: center;
            transition: background-color 0.3s ease, transform 0.2s ease, filter 0.3s ease;
        }
        .btn-carabineros {
            background-color: var(--color-carabineros);
        }
        .btn-carabineros:hover,
        .btn-carabineros:focus-visible {
            outline: none;
            filter: brightness(1.15);
            transform: scale(1.03); /* Ligeramente menos agresivo para no chocar con el texto */
        }
        .btn-bomberos {
            background-color: var(--color-bomberos);
        }
        .btn-bomberos:hover,
        .btn-bomberos:focus-visible {
            outline: none;
            filter: brightness(1.15);
            transform: scale(1.03);
        }
        .btn-ambulancia {
            background-color: var(--color-ambulancia-bg);
            color: var(--color-ambulancia-border);
            border: 4px solid var(--color-ambulancia-border);
            font-weight: 900;
        }
        .btn-ambulancia:hover,
        .btn-ambulancia:focus-visible {
            outline: none;
            background-color: #f3f4f6;
            transform: scale(1.03);
        }
        .desc {
            font-size: calc(1.5rem * var(--text-scale-factor)); /* Ajustar con text-scale-factor */
            font-weight: 600;
            margin-top: 0.25rem; /* Ajuste de margen superior */
            margin-bottom: 2rem; /* Ajuste de margen inferior */
            color: var(--color-text-base);
            user-select: text;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        footer {
            margin-top: auto;
            padding-top: 4rem;
            font-size: calc(0.875rem * var(--text-scale-factor)); /* Ajustar con text-scale-factor */
            color: #9ca3af;
            text-align: center;
            user-select: none;
        }

        /* Botones para ajustar texto - Consistente con index.html y tramites.html */
        .text-adjust-buttons {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 1001;
        }

        .text-adjust-buttons button {
            font-size: 2rem;
            padding: 0;
            border-radius: 1.5rem;
            background: var(--color-primary);
            color: white;
            border: none;
            cursor: pointer;
            user-select: none;
            width: 90px;
            height: 90px;
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.7);
            background-image: linear-gradient(rgba(255,255,255,0.15), rgba(255,255,255,0.15));
            transition: background-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease, background-image 0.3s ease;

            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }
        .text-adjust-buttons button:hover, .text-adjust-buttons button:focus-visible {
            background: var(--color-primary-hover);
            outline: none;
            box-shadow: 0 10px 20px rgba(30, 64, 175, 0.8);
            transform: translateY(-5px) scale(1.05);
            background-image: none;
        }

        /* Botón de emergencia principal (no necesario aquí, pero se mantiene la estructura por si se desea) */
        /* Eliminado ya que esta es la página de contactos de emergencia.
           Se asume que el botón de emergencia "principal" no va en esta página
           para evitar redundancia, pero se puede añadir si es un requisito.
        */

        /* Media Queries (Consistente con index.html y tramites.html) */
        @media (max-width: 768px) {
            header {
                padding: 1rem;
                height: auto; /* Permitir que la altura se ajuste */
                flex-direction: column; /* Apilar logo y nav en pantallas pequeñas */
                gap: 1rem;
            }
            .logo {
                font-size: 3rem;
            }
            nav {
                flex-wrap: wrap; /* Permitir que los enlaces se envuelvan */
                justify-content: center;
                gap: 0.75rem;
                font-size: 1.2rem;
            }
            nav a {
                padding: 0.75rem 1rem;
            }
            h1 {
                font-size: calc(2.8rem * var(--text-scale-factor));
                margin-bottom: 2rem;
            }
            .btn-emergency {
                font-size: calc(2.2rem * var(--text-scale-factor));
                max-width: 300px;
                padding: 1.25rem 0;
            }
            .desc {
                font-size: calc(1.1rem * var(--text-scale-factor));
                margin-bottom: 1.5rem;
            }
            .text-adjust-buttons {
                bottom: 1rem;
                right: 1rem;
                flex-direction: row; /* En fila en móviles */
                gap: 0.5rem;
            }
            .text-adjust-buttons button {
                width: 70px;
                height: 70px;
                font-size: 1.8rem;
                border-radius: 1rem;
            }
            footer {
                padding-top: 2rem;
            }
        }
    </style>
</head>
<body>
    <header role="banner" aria-label="Cabecera del sitio">
        <div class="logo">SEDAM</div>
        <nav role="navigation" aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="quienes-somos.html">Quiénes Somos</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>
    <main role="main">
        <h1>Contactos de Emergencia</h1>

        <a href="tel:133" class="btn-emergency btn-carabineros" aria-label="Llamar a Carabineros 133" title="Llamar a Carabineros de Chile">133</a>
        <p class="desc">Carabineros de Chile</p>

        <a href="tel:132" class="btn-emergency btn-bomberos" aria-label="Llamar a Bomberos 132" title="Llamar a Bomberos de Chile">132</a>
        <p class="desc">Bomberos de Chile</p>

        <a href="tel:131" class="btn-emergency btn-ambulancia" aria-label="Llamar a Ambulancia 131" title="Llamar a Ambulancia">131</a>
        <p class="desc">Ambulancia</p>
    </main>
    <footer role="contentinfo">
        &copy; 2025 SEDAM. Todos los derechos reservados.
    </footer>

    <div class="text-adjust-buttons">
        <button id="btn-aumentar-texto" aria-label="Aumentar tamaño de texto" title="Aumentar tamaño de texto" onclick="adjustTextSize(1)"><span>A+</span></button>
        <button id="btn-disminuir-texto" aria-label="Disminuir tamaño de texto" title="Disminuir tamaño de texto" onclick="adjustTextSize(-1)"><span>A-</span></button>
    </div>

    <script>
        const root = document.documentElement;
        // Cargar el factor de escala desde localStorage o usar 1 por defecto
        let textScaleFactor = parseFloat(localStorage.getItem('textScaleFactor')) || 1;
        const scaleStep = 0.1;
        const minScaleFactor = 0.8;
        const maxScaleFactor = 1.5;

        // Aplicar el factor de escala inicial al cargar la página
        root.style.setProperty('--text-scale-factor', textScaleFactor);

        function adjustTextSize(direction) {
            let newScaleFactor = textScaleFactor + (direction * scaleStep);

            if (newScaleFactor > maxScaleFactor) {
                newScaleFactor = maxScaleFactor;
            } else if (newScaleFactor < minScaleFactor) {
                newScaleFactor = minScaleFactor;
            }

            root.style.setProperty('--text-scale-factor', newScaleFactor);
            textScaleFactor = newScaleFactor;
            localStorage.setItem('textScaleFactor', newScaleFactor); // Guardar para persistencia
        }
    </script>
</body>
</html>
